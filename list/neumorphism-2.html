<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新拟态 2 — StyleCool 示例</title>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="https:../assets/style.css?v=20260610">
    <link rel="icon" type="image/png" href="https:../assets/logo.png">
    <link rel="apple-touch-icon" href="https:../assets/logo.png">
    <style>
/* ============================================================
   新拟态 2（Neumorphism 2）— 演示样式
   ============================================================ */
:root{--n2-bg:#D9E4F0;--n2-ink:#2E4058;--n2-ink2:#5A6F86;--n2-accent:#4A90C8;--n2-out:6px 6px 12px rgba(163,177,198,.8),-6px -6px 12px rgba(255,255,255,.9);--n2-in:inset 4px 4px 8px rgba(163,177,198,.6),inset -2px -2px 4px rgba(255,255,255,.8)}body{background:var(--n2-bg)!important;color:var(--n2-ink)}header{background:transparent!important;border-bottom:none!important;padding:0!important}header::after{display:none!important}
.n2-header{position:absolute;top:0;left:0;right:0;z-index:100}.n2-header-inner{position:relative;margin:16px clamp(20px,4vw,32px) 0;padding:14px 28px;background:var(--n2-bg);border-radius:20px;box-shadow:var(--n2-out);display:flex;align-items:center;justify-content:space-between;gap:16px}.n2-logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.n2-logo-icon{width:38px;height:38px;background:var(--n2-bg);border-radius:12px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--n2-out)}.n2-logo-icon img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}.n2-logo-text{display:inline-flex;flex-direction:column;line-height:1.2}.n2-logo-text strong{font-size:1rem;font-weight:700;color:var(--n2-ink)}.n2-logo-text em{font-style:normal;font-size:.75rem;color:var(--n2-ink2);margin-top:2px}.n2-header-actions a{display:inline-flex;align-items:center;padding:8px 16px;font-size:.875rem;font-weight:500;color:var(--n2-ink2);background:var(--n2-bg);border-radius:999px;text-decoration:none;box-shadow:var(--n2-out)}.n2-header-actions a:hover{color:var(--n2-accent);box-shadow:var(--n2-in)}
.n2-hero{position:relative;min-height:620px;padding:calc(92px+80px) 24px 80px;display:flex;align-items:center;justify-content:center}.n2-hero-card{position:relative;z-index:1;max-width:720px;padding:56px 48px;background:var(--n2-bg);border-radius:28px;box-shadow:var(--n2-out);text-align:center}.n2-hero-card h1{font-size:clamp(2rem,5vw,3.5rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:0 0 16px;color:var(--n2-ink)}.n2-hero-card h1 .accent{color:var(--n2-accent)}.n2-hero-card p{font-size:1.0625rem;line-height:1.7;color:var(--n2-ink2);margin:0}
.n2-components{max-width:1200px;margin:0 auto;padding:0 24px 96px}.n2-components-header{text-align:center;margin-bottom:48px}.n2-components-header h2{font-size:2rem;font-weight:800;color:var(--n2-ink);margin:0 0 12px}.n2-components-header p{color:var(--n2-ink2);max-width:560px;margin:0 auto}
.n2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.n2-component{padding:28px;background:var(--n2-bg);border-radius:20px;box-shadow:var(--n2-out)}.n2-component:hover{box-shadow:4px 4px 8px rgba(163,177,198,.4),-4px -4px 8px rgba(255,255,255,.5)}.n2-component h3{font-size:.9375rem;font-weight:700;color:var(--n2-ink);margin:0 0 4px}.n2-component>p{font-size:.8125rem;color:var(--n2-ink2);margin:0 0 16px}.n2-slot{margin-top:14px}
.n2-btn{display:inline-flex;align-items:center;padding:10px 20px;font-size:.875rem;font-weight:600;color:var(--n2-ink2);background:var(--n2-bg);border:0;border-radius:12px;cursor:pointer;box-shadow:var(--n2-out)}.n2-btn:hover{color:var(--n2-ink)}.n2-btn:active{box-shadow:var(--n2-in)}.n2-btn-primary{color:#fff;background:linear-gradient(135deg,var(--n2-accent),#3A6A9E);box-shadow:4px 4px 8px rgba(163,177,198,.4),-4px -4px 8px rgba(255,255,255,.5)}.n2-input{width:100%;padding:10px 14px;font-size:.875rem;color:var(--n2-ink);background:var(--n2-bg);border:0;border-radius:12px;outline:none;box-shadow:var(--n2-in);box-sizing:border-box}.n2-input:focus{box-shadow:inset 4px 4px 8px rgba(163,177,198,.7),inset -2px -2px 4px rgba(255,255,255,.9)}
.n2-mini-card{padding:14px;background:var(--n2-bg);border-radius:12px;box-shadow:var(--n2-in)}.n2-mini-card strong{font-size:.875rem;color:var(--n2-ink);display:block;font-weight:600}.n2-mini-card p{font-size:.75rem;color:var(--n2-ink2);margin:4px 0 0}
.n2-tag{display:inline-flex;padding:4px 12px;font-size:.75rem;font-weight:600;color:var(--n2-ink2);background:var(--n2-bg);border-radius:999px;box-shadow:var(--n2-out);margin-right:6px;margin-bottom:6px}.n2-tag-accent{color:var(--n2-accent)}.n2-nav{display:flex;gap:4px;padding:4px;background:var(--n2-bg);border-radius:12px;box-shadow:var(--n2-out)}.n2-nav-item{padding:8px 16px;font-size:.875rem;color:var(--n2-ink2);border-radius:8px;cursor:pointer}.n2-nav-item.active{background:var(--n2-bg);color:var(--n2-accent);font-weight:600;box-shadow:var(--n2-in)}.n2-alert{padding:12px 16px;background:var(--n2-bg);border-radius:12px;box-shadow:var(--n2-out);color:var(--n2-ink2);font-size:.875rem}
.prompt-floater{position:fixed;bottom:24px;left:24px;padding:10px 18px;background:var(--n2-bg);border-radius:999px;color:var(--n2-ink);font-weight:600;cursor:pointer;z-index:1000;box-shadow:var(--n2-out)}.prompt-floater:hover{color:var(--n2-accent);box-shadow:var(--n2-in)}.prompt-modal{position:fixed;bottom:88px;left:24px;width:min(440px,calc(100vw-48px));max-height:70vh;padding:20px;background:var(--n2-ink);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.15);z-index:1001;color:#fff;display:none;flex-direction:column}.prompt-modal.visible{display:flex}.prompt-modal-title{font-size:.875rem;font-weight:600;color:var(--n2-accent)}.prompt-modal-close{background:transparent;border:0;color:rgba(255,255,255,.5);cursor:pointer;font-size:1.2rem}.prompt-modal-content{font-size:.875rem;line-height:1.7;color:rgba(255,255,255,.9);overflow-y:auto;flex:1;margin-bottom:12px;white-space:pre-wrap;background:rgba(255,255,255,.06);padding:14px;border-radius:12px;font-family:ui-monospace,monospace}.prompt-modal-copy{padding:10px 16px;background:var(--n2-accent);color:#fff;border:0;border-radius:12px;font-weight:600;cursor:pointer}.prompt-modal-copy:hover{background:#3A6A9E}.prompt-modal-copy.done{background:#6BCB77}
main{padding:0;background:transparent}footer,body>footer{background:transparent!important;border:none!important;padding:24px 0!important;margin:0!important;text-align:center;color:var(--n2-ink2)}footer::after{display:none!important}footer>.container{max-width:1200px;margin:0 auto;padding:0 24px}footer p{font-size:.875rem;color:var(--n2-ink2);margin:0}.friend-links{margin:0;font-size:.75rem}.friend-links a{display:inline-block;padding:6px 14px;margin:0 4px;font-size:.75rem;color:var(--n2-ink2);background:var(--n2-bg);border-radius:999px;text-decoration:none;box-shadow:var(--n2-out)}.friend-links a:hover{box-shadow:var(--n2-in);color:var(--n2-accent)}
@media(max-width:960px){.n2-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.n2-header-inner{flex-direction:column;align-items:stretch;gap:10px;padding:12px 18px}.n2-header-actions{justify-content:center}.n2-logo-text em{display:none}.n2-hero{min-height:520px;padding:calc(92px+48px) 16px 48px}.n2-hero-card{padding:32px 24px}.n2-grid{grid-template-columns:1fr}.prompt-floater{bottom:16px;left:16px}.prompt-modal{left:16px;bottom:76px}}.name-en,.desc-en{display:none}
    </style>
</head>
<body>
<header class="n2-header"><div class="n2-header-inner"><a class="n2-logo" href="../example.php"><span class="n2-logo-icon"><img src="https:../assets/logo.png" alt="F"></span><span class="n2-logo-text"><strong>StyleCool</strong><em>新拟态2示例</em></span></a><div class="n2-header-actions"><a href="../example.php">← 返回</a></div></div></header>
<main><section class="n2-hero"><div class="n2-hero-card"><h1>新拟态 <span class="accent">2</span></h1><p>更深阴影 + 蓝色强调 + 油灰底<br>Neumorphism 深度演绎，触感更强烈</p></div></section>
<section class="n2-components"><div class="n2-components-header"><h2>模块化组件</h2><p>双重阴影贯穿每一个组件</p></div>
<div class="n2-grid">
<div class="n2-component"><h3>拟态按钮</h3><p>凸起 + 按下凹陷</p><div class="n2-slot" style="display:flex;gap:8px;"><button class="n2-btn">默认</button><button class="n2-btn n2-btn-primary">主要</button></div></div>
<div class="n2-component"><h3>凹陷输入框</h3><p>内阴影凹陷</p><div class="n2-slot"><input class="n2-input" placeholder="输入内容..."></div></div>
<div class="n2-component"><h3>凹陷嵌套</h3><p>内阴影层次</p><div class="n2-slot"><div class="n2-mini-card"><strong>凹陷嵌套</strong><p>内阴影·阴阳</p></div></div></div>
<div class="n2-component"><h3>拟态标签</h3><p>凸起胶囊</p><div class="n2-slot"><span class="n2-tag">前端</span><span class="n2-tag n2-tag-accent">拟态</span></div></div>
<div class="n2-component"><h3>拟态导航</h3><p>凸起+凹陷选中</p><div class="n2-slot"><nav class="n2-nav"><span class="n2-nav-item active">首页</span><span class="n2-nav-item">作品</span><span class="n2-nav-item">关于</span></nav></div></div>
<div class="n2-component"><h3>拟态提示</h3><p>凸起阴影</p><div class="n2-slot"><div class="n2-alert">⚠ 操作不可撤销</div></div></div>
</div></section></main>
<footer><div class="container"><p>© 2025-2026 函数库 | Powered by Mutantcat</p><div class="friend-links"><span>友情链接：</span><a href="https://www.mutantcat.org/">异猫工作群</a><a href="https://www.fcnesyouxi.top/">FC/NES</a><a href="https://www.jqshengtian.top/">学习资料</a></div></div></footer>
<button class="prompt-floater" id="prompt-floater">复制提示词</button>
<div class="prompt-modal" id="prompt-modal"><div class="prompt-modal-header"><span class="prompt-modal-title">新拟态 2 — 完整提示词</span><button class="prompt-modal-close" id="prompt-close">×</button></div><div class="prompt-modal-content" id="prompt-content"></div><button class="prompt-modal-copy" id="prompt-copy">复制</button></div>
<script>
var PROMPT_TEXT = "采用新拟态 2（Neumorphism 2）设计风格。背景油灰蓝 #D9E4F0。双重阴影更强烈：外向 6px 6px 12px rgba(163,177,198,0.8) + 内向 -6px -6px 12px rgba(255,255,255,0.9)。输入框内阴影凹陷。按钮按下时切换内阴影。圆角 12-20px。主色天蓝 #4A90C8。整体触感强烈、柔和、安静。";
document.getElementById('prompt-content').textContent = PROMPT_TEXT;
var btn=document.getElementById('prompt-floater'),modal=document.getElementById('prompt-modal'),close=document.getElementById('prompt-close'),copy=document.getElementById('prompt-copy');
btn.addEventListener('click',function(){modal.classList.toggle('visible')});close.addEventListener('click',function(){modal.classList.remove('visible')});
document.addEventListener('click',function(e){if(!modal.contains(e.target)&&!btn.contains(e.target))modal.classList.remove('visible')});
copy.addEventListener('click',function(){function s(){copy.textContent='已复制';copy.classList.add('done');setTimeout(function(){copy.textContent='复制';copy.classList.remove('done')},1500)}
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(PROMPT_TEXT).then(s).catch(function(){f()});else f();function f(){var ta=document.createElement('textarea');ta.value=PROMPT_TEXT;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');s()}catch(e){}document.body.removeChild(ta)}});
</script>
</body>
</html>
