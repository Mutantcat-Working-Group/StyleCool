    <style>:root{--bg:#F0F8FF;--ink:#1B3A6B;--ink2:#6080A8}body{background:var(--bg)!important;color:var(--ink)}header{background:transparent!important;border-bottom:none!important;padding:0!important}header::after{display:none!important}.h{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.95);backdrop-filter:blur(20px)}.hi{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}.l{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:inherit}.li{width:36px;height:36px;background:var(--ink);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}.li img{width:100%;height:100%;object-fit:cover;display:block}.lt strong{font-size:.9375rem;font-weight:700;color:var(--ink)}.ha a{display:inline-flex;align-items:center;padding:6px 14px;font-size:.8125rem;color:var(--ink2);text-decoration:none}.ha a:hover{color:var(--ink)}.he{padding:60px 24px;text-align:center;max-width:640px;margin:0 auto}.he h1{font-size:clamp(2rem,4vw,3rem);font-weight:700;color:var(--ink);margin:0 0 12px}.he p{font-size:.9375rem;line-height:1.7;color:var(--ink2);margin:0}.co{max-width:1200px;margin:0 auto;padding:0 24px 80px}.ch{text-align:center;margin-bottom:48px}.ch h2{font-size:1.25rem;font-weight:700;color:var(--ink);margin:0}.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.cp{padding:24px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px}.cp h3{font-size:.875rem;font-weight:700;color:var(--ink);margin:0 0 4px}.cp>p{font-size:.75rem;color:var(--ink2);margin:0 0 14px}.sl{margin-top:14px}.btn{display:inline-flex;align-items:center;padding:8px 16px;font-size:.8125rem;font-weight:600;color:var(--ink);border:1px solid var(--ink2);border-radius:6px;cursor:pointer;background:transparent}.btn:hover{background:var(--ink);color:#fff}.btn-p{background:var(--ink);color:#fff}.content{font-size:.8125rem;line-height:1.7;color:var(--ink2);white-space:pre-wrap;background:rgba(0,0,0,.03);padding:14px;border-radius:8px;font-family:monospace;margin-bottom:12px}main{padding:0;background:transparent}footer,body>footer{background:transparent!important;border:none!important;border-top:1px solid rgba(0,0,0,.06)!important;padding:24px 0!important;margin:0!important;text-align:center;color:var(--ink2)}.floater{position:fixed;bottom:24px;left:24px;padding:10px 18px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;z-index:1000;border-radius:6px}.modal{position:fixed;bottom:88px;left:24px;width:min(440px,calc(100vw-48px));max-height:70vh;padding:20px;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:12px;z-index:1001;display:none;flex-direction:column}.modal.v{display:flex}@media(max-width:960px){.gr{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.hi{flex-direction:column;height:auto;padding:10px 18px}.gr{grid-template-columns:1fr}.floater{bottom:16px;left:16px}.modal{left:16px;bottom:76px}}</style>

<body>
<header class="h"><div class="hi"><a class="l" href="../example.php"><span class="li"><img src="https:../assets/logo.png" alt="F"></span><span class="lt"><strong>StyleCool</strong></span></a><div class="ha"><a href="../example.php">← 返回</a></div></div></header>
<main>
<section class="he"><h1>天空蓝</h1><p>采用天空蓝（Sky Blue）设计。背景天蓝白 #F0F8FF。主色天空蓝 #5A9AE8。卡片白底 + 1px 蓝边。按钮天蓝实心。整体开阔、自由、清爽。</p></section>
<section class="co"><div class="ch"><h2>模块化组件</h2></div>
<div class="gr">
<div class="cp"><h3>风格按钮</h3><p>默认/主要</p><div class="sl" style="display:flex;gap:8px;"><button class="btn">默认</button><button class="btn btn-p">主要</button></div></div>
<div class="cp"><h3>风格输入框</h3><p>聚焦变色</p><div class="sl"><input class="btn" style="width:100%;text-align:left;" placeholder="输入内容..."></div></div>
<div class="cp"><h3>嵌套卡片</h3><p>浅底层次</p><div class="sl"><div style="padding:12px;background:rgba(0,0,0,.03);border-radius:6px"><strong>嵌套卡片</strong><p style="font-size:.75rem;color:var(--ink2);margin:4px 0 0">浅底 · 层次</p></div></div></div>
<div class="cp"><h3>风格标签</h3><p>胶囊形</p><div class="sl"><span class="btn" style="padding:3px 8px;font-size:.6875rem;border-radius:4px;cursor:default">标签</span></div></div>
<div class="cp"><h3>风格导航</h3><p>下划线</p><div class="sl"><nav style="display:flex;gap:0"><span style="padding:8px 14px;font-size:.8125rem;color:var(--ink);border-bottom:2px solid var(--ink);cursor:pointer">首页</span><span style="padding:8px 14px;font-size:.8125rem;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer">作品</span><span style="padding:8px 14px;font-size:.8125rem;color:var(--ink2);cursor:pointer">关于</span></nav></div></div>
<div class="cp"><h3>风格提示</h3><p>左侧色条</p><div class="sl"><div style="padding:10px 14px;border-left:3px solid var(--ink);color:var(--ink2);font-size:.8125rem">⚠ 操作提示</div></div></div>
</div></section></main>
<footer><div class="container"><p>© 2025-2026 函数库 | Powered by Mutantcat</p><div class="friend-links"><span>友情链接：</span><a href="https://www.mutantcat.org/">异猫工作群</a><a href="https://www.fcnesyouxi.top/">FC/NES</a><a href="https://www.jqshengtian.top/">学习资料</a></div></div></footer>
<button class="floater" id="f">复制提示词</button>
<div class="modal" id="m"><div class="prompt-modal-header"><span class="prompt-modal-title">天空蓝 — 完整提示词</span><button class="prompt-modal-close" id="c">×</button></div><div class="content" id="content"></div><button class="btn btn-p" id="cp">复制</button></div>
<script>
var PROMPT_TEXT = "采用天空蓝（Sky Blue）设计。背景天蓝白 #F0F8FF。主色天空蓝 #5A9AE8。卡片白底 + 1px 蓝边。按钮天蓝实心。整体开阔、自由、清爽。";
document.getElementById("content").textContent = PROMPT_TEXT;
var b=document.getElementById("f"),m=document.getElementById("m"),c=document.getElementById("c"),cp=document.getElementById("cp");
b.addEventListener("click",function(){m.classList.toggle("v")});
c.addEventListener("click",function(){m.classList.remove("v")});
document.addEventListener("click",function(e){if(!m.contains(e.target)&&!b.contains(e.target))m.classList.remove("v")});
cp.addEventListener("click",function(){function s(){cp.textContent="已复制";setTimeout(function(){cp.textContent="复制"},1500)}
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(PROMPT_TEXT).then(s).catch(function(){f()});else f();function f(){var ta=document.createElement("textarea");ta.value=PROMPT_TEXT;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");s()}catch(e){}document.body.removeChild(ta)}});
</script>
</body>
